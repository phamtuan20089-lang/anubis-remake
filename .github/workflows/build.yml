name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  natives:
    name: ImGui native (Android arm64)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build libimgui-java64.so
        run: bash scripts/build-android-natives.sh
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: natives-diagnostics
          path: out/diagnostics.txt
          if-no-files-found: ignore
      - name: Upload native
        uses: actions/upload-artifact@v4
        with:
          name: imgui-native-android-arm64
          path: out/libimgui-java64.so
          if-no-files-found: error

  build:
    runs-on: ubuntu-latest
    needs: natives
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch ImGui native (if the natives job succeeded)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: imgui-native-android-arm64
          path: src/client/resources/natives/android-arm64
      - name: Build
        run: |
          ls -la src/client/resources/natives/android-arm64 || true
          chmod +x gradlew
          ./gradlew build --no-daemon
      - name: Upload jar (fork thuan, ~136 module)
        uses: actions/upload-artifact@v4
        with:
          name: anubis-pojav
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
      - name: Ghep module tu anubis_remake (138 module)
        run: bash scripts/merge-remake.sh vendor/anubis_remake.jar
      - name: Upload jar da ghep
        uses: actions/upload-artifact@v4
        with:
          name: anubis-pojav-merged
          path: build/libs/*-merged.jar
